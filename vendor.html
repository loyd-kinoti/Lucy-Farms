<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lucy Farms – Vendors</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f2f6ec;--s:#fff;--ink:#241d15;--mu:#5f6a57;--lf:#2d6a3e;--li:#fff;--bt:#b02a43;--ln:#d8e1cc}
@media(prefers-color-scheme:dark){:root{--bg:#17201a;--s:#202c23;--ink:#eef3e6;--mu:#a9b7a0;--lf:#8fd09a;--li:#12301a;--bt:#f08098;--ln:#33443a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
.wrap{max-width:900px;margin:auto;padding:20px}
h1{margin:0 0 12px}h2{margin:22px 0 8px}
.btn{border:2px solid var(--lf);border-radius:999px;background:var(--lf);color:var(--li);font-weight:700;padding:7px 16px;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border-color:var(--ink)}.btn.del{background:none;color:var(--bt);border-color:var(--bt)}
input,select{padding:8px;border:1.5px solid var(--ln);border-radius:8px;background:var(--s);color:var(--ink);font:inherit;max-width:100%}
.box{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{color:var(--bt);min-height:1.4em}
img.t{width:48px;height:48px;object-fit:cover;border-radius:8px;background:var(--bg)}
#rmap{height:300px;border-radius:10px;margin:8px 0}
small{color:var(--mu)}
:focus-visible{outline:3px solid var(--bt);outline-offset:2px}
</style>
</head>
<body><div class="wrap">
<h1>Lucy Farms vendors</h1>
<p class="msg" id="err" role="alert"></p>

<div id="auth" class="box" hidden>
 <p>Mama mboga? Create an account or log in to sell on Lucy Farms.</p>
 <div class="row"><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (6+)" autocomplete="current-password">
 <button class="btn" id="li">Log in</button><button class="btn alt" id="su">Create account</button></div>
 <p class="msg" id="am" role="status"></p>
</div>

<div id="reg" class="box" hidden>
 <h2 style="margin-top:0">Register as a vendor</h2>
 <div class="row"><input id="vn" placeholder="Your name or stall name"><input id="vp" type="tel" placeholder="Phone (07…)"></div>
 <p>Drop a pin where you sell from, then choose how far you can deliver.</p>
 <div id="rmap"></div>
 <div class="row"><button class="btn alt" id="gps">Use my location</button>
 <label>Delivery radius (km) <input id="vr" type="number" min="0.5" max="50" step="0.5" value="5" style="width:80px"></label></div>
 <p class="msg" id="rm" role="status"></p>
 <button class="btn" id="send">Submit application</button>
</div>

<div id="pend" class="box" hidden><b id="pt"></b> <button class="btn alt" onclick="out()">Log out</button></div>

<div id="app" hidden>
 <div class="row" style="justify-content:space-between"><b id="hi"></b><button class="btn alt" onclick="out()">Log out</button></div>
 <h2>Add a product</h2>
 <div class="box row">
  <input id="n" placeholder="Name"><input id="u" placeholder="Unit (1 kg)" size="10"><input id="c" placeholder="Category" list="cats" size="12">
  <datalist id="cats"><option>Vegetables<option>Fruit<option>Beverages<option>Eggs &amp; dairy<option>Pantry</datalist>
  <input id="p" type="number" min="0" placeholder="Price KSh" style="width:110px"><input id="f" type="file" accept="image/*">
  <button class="btn" id="add">Add</button>
 </div>
 <p class="msg" id="pm" role="status"></p>
 <h2>My products</h2><div id="pl"></div>
 <h2>Orders to prepare</h2><div id="ol"></div>
</div>
</div>

<script>window.onerror=function(m){document.getElementById("err").textContent="Error: "+m};window.onunhandledrejection=function(e){document.getElementById("err").textContent="Error: "+((e.reason&&e.reason.message)||e.reason)}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SUPABASE_URL="https://koocvlmjefkdjhkupvyo.supabase.co";
var SUPABASE_KEY="sb_publishable_RkX_pRK4msxNE1bQXLVXSw_jmJVNIlX";
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),V=null,map=null,mk=null,pin=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(v){return "KSh "+Math.round(v).toLocaleString("en-KE")}
function show(w){["auth","reg","pend","app"].forEach(function(i){$(i).hidden=i!==w})}
function out(){sb.auth.signOut().then(boot)}

async function boot(){
 var s=(await sb.auth.getSession()).data.session;
 if(!s){show("auth");return}
 var r=await sb.from("vendors").select("id,name,status").eq("user_id",s.user.id).maybeSingle();
 if(r.error)throw r.error;
 if(!r.data){show("reg");initMap();return}
 V=r.data;
 if(V.status!=="approved"){$("pt").textContent=V.status==="pending"?"Thanks "+V.name+"! Your application is waiting for approval by Lucy Farms.":"Sorry, your application was not approved.";show("pend");return}
 $("hi").textContent="Welcome, "+V.name;show("app");loadP();loadO()}
async function auth(sign){var e=$("em").value.trim(),p=$("pw").value;$("am").textContent="";
 var r=sign?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
 if(r.error){$("am").textContent=r.error.message;return}
 if(sign&&!r.data.session){$("am").textContent="Check your email to confirm, then log in.";return}
 boot()}
$("li").onclick=function(){auth(false)};$("su").onclick=function(){auth(true)};

function setPin(a,b){pin={lat:a,lng:b};if(mk)mk.setLatLng([a,b]);else mk=L.marker([a,b]).addTo(map);map.setView([a,b],Math.max(map.getZoom(),14))}
function initMap(){if(!map){map=L.map("rmap").setView([-1.2864,36.8172],11);
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
 map.on("click",function(e){setPin(e.latlng.lat,e.latlng.lng)})}
 setTimeout(function(){map.invalidateSize()},50)}
$("gps").onclick=function(){if(!navigator.geolocation){$("rm").textContent="Location not available. Tap the map instead.";return}
 navigator.geolocation.getCurrentPosition(function(p){setPin(p.coords.latitude,p.coords.longitude)},function(){$("rm").textContent="Could not get location. Tap the map instead."})};
$("send").onclick=async function(){var n=$("vn").value.trim(),ph=$("vp").value.trim(),rad=parseFloat($("vr").value);
 if(!n||!ph||!pin||!(rad>=0.5)){$("rm").textContent="Enter your name, phone, drop a pin, and set a radius of at least 0.5 km.";return}
 var r=await sb.from("vendors").insert({name:n,phone:ph,lat:pin.lat,lng:pin.lng,radius_km:rad});
 if(r.error){$("rm").textContent="Failed: "+r.error.message;return}
 boot()};

async function up(file){var path=V.id+"/"+Date.now()+"-"+file.name.replace(/[^\w.]/g,"_");
 var r=await sb.storage.from("product-images").upload(path,file);if(r.error)throw r.error;
 return sb.storage.from("product-images").getPublicUrl(path).data.publicUrl}
$("add").onclick=async function(){var name=$("n").value.trim(),price=parseInt($("p").value,10);
 if(!name||isNaN(price)){$("pm").textContent="Enter a name and a price.";return}
 $("pm").textContent="Saving…";
 try{var img=$("f").files[0]?await up($("f").files[0]):null;
  var r=await sb.from("products").insert({vendor_id:V.id,name:name,unit:$("u").value.trim(),category:$("c").value.trim()||"Vegetables",price:price,image_url:img});
  if(r.error)throw r.error;["n","u","c","p","f"].forEach(function(i){$(i).value=""});$("pm").textContent="Added.";loadP()}
 catch(e){$("pm").textContent="Failed: "+e.message}};
async function loadP(){var r=await sb.from("products").select("*").eq("vendor_id",V.id).order("name");
 $("pl").innerHTML=r.error?"Could not load.":(r.data.length?r.data.map(function(p){
  return '<div class="box row" data-id="'+p.id+'"><img class="t" src="'+esc(p.image_url||"")+'" alt=""><b style="flex:1;min-width:130px">'+esc(p.name)+' <small>'+esc(p.unit)+'</small></b><input type="number" class="pr" value="'+p.price+'" style="width:100px" aria-label="Price"><label><input type="checkbox" class="st"'+(p.in_stock?" checked":"")+'> In stock today</label><button class="btn sv">Save</button><button class="btn del dl">Delete</button></div>'}).join(""):"No products yet.")}
$("pl").addEventListener("click",async function(e){var b=e.target.closest("button");if(!b)return;var box=b.closest("[data-id]"),id=box.dataset.id;
 try{if(b.classList.contains("dl")){if(!confirm("Delete this product?"))return;var d=await sb.from("products").delete().eq("id",id);if(d.error)throw d.error}
  if(b.classList.contains("sv")){var r=await sb.from("products").update({price:parseInt(box.querySelector(".pr").value,10),in_stock:box.querySelector(".st").checked}).eq("id",id);if(r.error)throw r.error;$("pm").textContent="Saved."}
  loadP()}catch(x){$("pm").textContent="Failed: "+x.message}});

async function loadO(){var r=await sb.from("order_items").select("id,order_id,product_name,unit,qty,price,status").eq("vendor_id",V.id).order("id",{ascending:false});
 if(r.error){$("ol").textContent="Could not load orders.";return}
 $("ol").innerHTML=r.data.length?r.data.map(function(o){return '<div class="box"><b>'+o.qty+' × '+esc(o.product_name)+'</b> <small>('+esc(o.unit)+') · '+money(o.price*o.qty)+' · order #'+o.order_id+' · '+esc(o.status)+'</small></div>'}).join("")+'<p><small>Lucy Farms will contact you about collection and delivery.</small></p>':"No orders yet."}
boot().catch(function(e){show("auth");$("err").textContent="Error: "+e.message});
</script>
</body>
</html>
